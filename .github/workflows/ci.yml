name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Restore pinned tools (NSwag)
        run: dotnet tool restore

      - name: Generation guard check (GEN-05/GEN-08/GEN-09)
        run: dotnet run --project tools/XApiSharp.CodeGen -- guard-check

      - name: Fail if guard-check produced an uncommitted method-name-map change
        run: git diff --exit-code spec/method-name-map.json

      - name: Endpoint coverage-matrix gate (spec 22.1/27)
        run: dotnet run --project tools/XApiSharp.CodeGen -- coverage-check

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test tests/XApiSharp.UnitTests/XApiSharp.UnitTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./artifacts/coverage/unit
          dotnet test tests/XApiSharp.ContractTests/XApiSharp.ContractTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./artifacts/coverage/contract
          dotnet test tests/XApiSharp.IntegrationTests/XApiSharp.IntegrationTests.csproj --configuration Release --no-build
          dotnet test tests/XApiSharp.SoakTests/XApiSharp.SoakTests.csproj --configuration Release --no-build

      - name: Branch coverage gate (spec 19.5 - 80% hand-written core)
        run: dotnet run --project tools/XApiSharp.CodeGen -- branch-coverage-check --unit ./artifacts/coverage/unit --contract ./artifacts/coverage/contract

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./artifacts

  # TODO (stage E2+): once tools/XApiSharp.CodeGen `generate` output is actually wired into
  # src/XApiSharp/Generated/ and committed, add a full "regenerate and diff" job here (GEN-08)
  # in addition to the guard-check above, which only validates the guard registry today.
  # See .github/workflows/release.yml (stage E8) for the release-candidate pipeline; it still
  # needs real NuGet ownership/Trusted Publishing configured (spec 23.1) before E9 can publish.
